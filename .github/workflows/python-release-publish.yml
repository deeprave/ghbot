name: Build and Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Require main and successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main." >&2
            exit 1
          fi
          if ! gh run list --workflow Validate --branch main --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq 'length > 0' | grep -qx true; then
            echo "Validate has not succeeded for $GITHUB_SHA on main." >&2
            exit 1
          fi

      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI via OIDC trusted publishing
        run: uv publish --trusted-publishing always

  create-release:
    name: Create GitHub Release
    needs: [validate-release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
