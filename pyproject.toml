[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[project]
name = "ghbot"
version = "0.9.5"
description = "Autofix for github"
readme = "README.md"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
license = { file = "LICENSE.md" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "click",
    "httpx",
    "gidgethub",
    "anyio>=4.12.1",
]

[project.urls]
Homepage = "https://github.com/deeprave/ghbot"
Repository = "https://github.com/deeprave/ghbot"
Issues = "https://github.com/deeprave/ghbot/issues"

[project.scripts]
ghbot = "ghbot.__main__:cli"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-Werror -Walways"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "anyio[trio]>=4.0",
    "ruff>=0.15.5",
    "ty>=0.0.63",
    "hypothesis>=6.152.4",
]
